<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Editor for the BOSS RC-500 Loop Station over its USB port: memories, system settings, loops and live MIDI control.">
<meta name="theme-color" content="#14171c">
<title>RC-500 Editor</title>
<link rel="icon" href="icon.svg?v=2.49" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=2.49">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg?v=2.49" width="24" height="24" alt="" class="appicon">
    <span class="only-wide">RC-500 <b>Editor</b></span></div>
  <button id="memPick" class="mempick only-narrow" aria-label="Choose memory"></button>
  <button id="status" class="status" title="Connection and data — tap for details"></button>
  <div class="actions">
    <button id="btnLoad" class="primary" title="Read the memories from the pedal"><span class="ic">⤓</span><span class="lb">Load from pedal</span></button>
    <button id="btnSave" class="save" title="Write your changes to the pedal (Ctrl+S)"><span class="ic">⤒</span><span class="lb">Save to pedal</span></button>
    <button id="btnUndo" class="iconbtn" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" class="iconbtn" title="Redo (Ctrl+Y)">↷</button>
    <button id="btnMore" class="iconbtn" title="Theme" aria-label="Theme"></button>
  </div>
</header>
<div id="banner"></div>
<nav class="tabs">
  <button data-page="start"><span class="ti">⌂</span><span>Start</span></button>
  <button data-page="direct"><span class="ti">◉</span><span>Direct</span></button>
  <button data-page="memory"><span class="ti">☰</span><span>Memory</span></button>
  <button data-page="loops"><span class="ti">∞</span><span>Loops</span></button>
  <button data-page="remote" class="only-wide"><span class="ti">⇄</span><span>MIDI</span></button>
  <button data-page="about" class="only-wide"><span class="ti">?</span><span>Help</span></button>
  <button data-page="system"><span class="ti">⚙</span><span>System</span></button>
</nav>
<div class="layout">
  <aside class="side">
    <div class="sidehead only-narrow"><b>Choose memory</b><button id="btnCloseList" class="iconbtn" aria-label="Close">✕</button></div>
    <input id="memfilter" type="search" placeholder="Find memory…" aria-label="Find memory">
    <ul id="memlist"></ul>
  </aside>
  <main id="main"></main>
</div>
<input id="dirinput" type="file" webkitdirectory directory multiple hidden>
<div id="toasts"></div>
<script src="js/factory.js?v=2.49"></script>
<script src="js/rc0.js?v=2.49"></script>
<script src="js/params.js?v=2.49"></script>
<script src="js/audio.js?v=2.49"></script>
<script src="js/platform.js?v=2.49"></script>
<script src="js/names.js?v=2.49"></script>
<script src="js/direct.js?v=2.49"></script>
<script src="js/app.js?v=2.49"></script>
</body>
</html>
